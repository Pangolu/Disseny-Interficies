<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8"/>
    <title>Chart Example </title>
    <script type="module" src="./package/dist/chart.umd.js"></script>

<script>
  document.addEventListener("DOMContentLoaded",inicializar);

  function inicializar(){
    const canvas = document.getElementById('myChart');
    new Chart(canvas, {
      type: 'bar',
      data: {
        labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
        datasets: [{
          label: '# of Votes',
          data: [12, 19, 3, 15, 2, 3], 
          borderWidth: 1,
        }/*,
        {
          label: '# of Nulos',
          data: [17, 9, 13, 5, 22, 3], 
          borderWidth: 1,
        }*/
        ]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true
          }/*,
          x: { 
          	stacked:true
          }*/
        }
      }
    });
  }
</script>
</head>


<body>
  <div>
  <canvas id="myChart"></canvas>
</div>



  
</body>
</html>
