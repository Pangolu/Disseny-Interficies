<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chart Example</title>
    <script src="./package/dist/chart.umd.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", inicializar);

      var grafico;
      var tiposgraficosjoder = ["bar", "line", "radar", "pie", "doughnut", "polarArea"];

      /*Funcion que modifica el grafico*/
      function anyadirDato() {
        grafico.data.datasets[0].data[0] = Math.floor(Math.random() * 20);

        grafico.update();

      }
      function modificaTipo(){
        grafico.config.type = tiposgraficosjoder[Math.floor(Math.random() * tiposgraficosjoder.length)];
        grafico.update();
      }

      function reaccionar(evento){
        if (!grafico.scales.x || !grafico.scales.y) {
          return;
        }

        const canvasPosition = Chart.helpers.getRelativePosition(evento, grafico);

        const dataX = grafico.scales.x.getValueForPixel(canvasPosition.x);
        const dataY = grafico.scales.y.getValueForPixel(canvasPosition.y);

        console.log("X: " + dataX + " Y: " + dataY);
      } 

      function inicializar() {
        const canvas = document.getElementById("myChart");
        grafico = new Chart(canvas, {
          type: "bar",
          data: {
            labels: ["Red", "Blue", "Yellow", "Green", "Purple", "Orange"],
            datasets: [
              {
                label: "# of Votes",
                data: [12, 19, 3, 15, 2, 3],
                borderWidth: 1,
              } /*,
        {
          label: '# of Nulos',
          data: [17, 9, 13, 5, 22, 3], 
          borderWidth: 1,
        }*/,
            ],
          },
          options: {
            scales: {
              y: {
                beginAtZero: true,
              } /*,
          x: { 
          	stacked:true
          }*/,
            },
            onClick: reaccionar
          },
        });

        const elboto = document.getElementById("estopaafegirundatoLOL");
        elboto.addEventListener("click", anyadirDato);

        const botonTipo = document.getElementById("mierdon");
        botonTipo.addEventListener("click", modificaTipo);
      }
    </script>
  </head>

  <body>
    <div>
      <canvas id="myChart"></canvas>
    </div>
    <button id="estopaafegirundatoLOL">WTF</button>
    <button id="mierdon">saidhaspd</button>
  </body>
</html>
