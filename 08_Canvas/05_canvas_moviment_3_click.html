<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Canvas tutorial</title>

    <script type="text/javascript">
      // Contexto 2D del canvas.
      var ctx;
      // Posición actual del cuadrado.
      var iniciX = 100;
      var iniciY = 100;
      // Variable heredada no usada en esta versión.
      var derecha = true;
      // Velocidad horizontal y vertical (px por tick de `temporizador`).
      var velX = -0.3;
      var velY = 1.3;

      // Bucle de dibujo: limpia y pinta el cuadrado en la posición actual.
      function dibujar() {
        if (ctx) {
          // Limpia el área visible usada por el ejemplo.
          ctx.clearRect(0, 0, 500, 500); //netegem tot per a que no es solapen les imatges
          // Configura color y dibuja el cuadrado.
          ctx.fillStyle = "red";

          ctx.fillRect(iniciX, iniciY, 100, 100);
          // Solicita siguiente frame de render.
          window.requestAnimationFrame(dibujar);
        }
      }

      // Bucle lógico: actualiza posición y resuelve rebotes contra paredes.
      function temporizador() {
        // Avanza la posición según la velocidad actual.
        iniciX += velX;
        iniciY += velY;

        // Rebote en borde izquierdo: forzamos velocidad positiva en X.
        if (iniciX <= 0) {
          velX = Math.abs(velX);
        }
        // Rebote en borde derecho: forzamos velocidad negativa en X.
        if (iniciX >= 500 - 100) {
          velX = -Math.abs(velX);
        }
        // Rebote en borde superior: forzamos velocidad positiva en Y.
        if (iniciY <= 0) {
          velY = Math.abs(velY);
        }
        // Rebote en borde inferior: forzamos velocidad negativa en Y.
        if (iniciY >= 500 - 100) {
          velY = -Math.abs(velY);
        }
      }

      // Inicializa canvas y arranca bucles de render y lógica.
      function inicializar() {
        // Referencia al canvas.
        canvas = document.querySelector("#tutorial");

        // Comprobación de soporte Canvas 2D.
        if (canvas.getContext) ctx = canvas.getContext("2d");
        // Arranca render continuo.
        dibujar();
        // Arranca actualización de física cada 10ms.
        window.setInterval(temporizador, 10);
      }

      // Punto de entrada cuando el DOM está listo.
      document.addEventListener("DOMContentLoaded", inicializar);
    </script>
    <style type="text/css">
      canvas {
        border: 1px solid black;
      }
    </style>
  </head>

  <body>
    <div>
      <button type="button" id="boton">Dibuja</button>
    </div>

    <canvas id="tutorial" width="1500" height="1500"></canvas>
  </body>
</html>
